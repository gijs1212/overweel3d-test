services:
  bambu-bridge:
    build:
      context: /mnt/data/supervisor/share/overweel3d
      dockerfile: Dockerfile
    volumes:
      - /mnt/data/supervisor/share/overweel3d/data:/data:rw
      - /mnt/data/supervisor/share/overweel3d/data:/config/overweel3d:rw
    environment:
      BAMBU_ACCOUNT: ${BAMBU_ACCOUNT:-}
      WEBSITE_PAIRING_CODE: ${WEBSITE_PAIRING_CODE:-}
    restart: unless-stopped
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
